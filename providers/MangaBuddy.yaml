name: MangaBuddy
base_url: https://mangabuddy.me
version: "1"
default_score: -20 # Low image quality, but large library, good backup.
tags:
  - aggregator
  - low_quality_scans
  - nsfw
rate_limit:
  requests_per_minute: 30

search:
  steps:
    - open: "{base_url}/search?q={query}"
    - foreach:
        selector: ".book-item"
        extract:
          title:
            selector: ".meta .title h3 a"
            content: attr
            attr_name: title
          url:
            selector: ".meta .title h3 a"
            content: attr
            attr_name: href
            prefix: "{base_url}"
          cover:
            selector: ".thumb img"
            content: attr
            attr_name: src

chapters:
  steps:
    - open: "{manga_url}"
    - extract_js:
        var: manga_id
        script: |
          document.querySelector('#comment-form[data-mg-id]').getAttribute('data-mg-id')
    - extract_js:
        var: _chapters_injected
        script: |
          (async function() {
            const resp = await fetch('/api/manga/{manga_id}/chapters?source=detail');
            const html = await resp.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString('<ul>' + html + '</ul>', 'text/html');
            const items = Array.from(doc.querySelectorAll('li'));

            // Normalise dates in-place before injecting
            const now = Date.now();
            items.forEach(li => {
              const timeEl = li.querySelector('time.chapter-update');
              if (!timeEl) return;
              const raw = timeEl.textContent.trim();
              let ts = null;
              if (/ago|minute|hour|day|week|month|year|just now/i.test(raw)) {
                const num = parseInt(raw, 10) || 0;
                const lo = raw.toLowerCase();
                if (lo.includes('minute')) ts = now - num * 60 * 1000;
                else if (lo.includes('hour'))  ts = now - num * 3600 * 1000;
                else if (lo.includes('day'))   ts = now - num * 86400 * 1000;
                else if (lo.includes('week'))  ts = now - num * 604800 * 1000;
                else if (lo.includes('month')) ts = now - num * 2592000 * 1000;
                else if (lo.includes('year'))  ts = now - num * 31536000 * 1000;
                else if (lo.includes('just now')) ts = now;
              } else {
                const d = new Date(raw);
                if (!isNaN(d)) ts = d.getTime();
              }
              if (ts !== null) timeEl.textContent = Math.floor(ts / 1000);
            });

            // Inject into a hidden container so foreach can collect them
            let container = document.getElementById('_rebarr_chapters');
            if (!container) {
              container = document.createElement('ul');
              container.id = '_rebarr_chapters';
              container.style.display = 'none';
              document.body.appendChild(container);
            }
            container.innerHTML = '';
            items.forEach(li => container.appendChild(li.cloneNode(true)));
            return container.children.length;
          })()
    - foreach:
        selector: "#_rebarr_chapters li"
        extract:
          number_raw:
            selector: "strong.chapter-title"
            content: text
          url:
            selector: "a"
            content: attr
            attr_name: href
            prefix: "{base_url}"
          date:
            selector: "time.chapter-update"
            content: text
            date_format: "%s"

pages:
  steps:
    - open: "{chapter_url}"
    - extract_js:
        var: page_urls
        script: |
          (async function() {
            // Scroll through the page incrementally to trigger lazy loading
            for (let y = 0; y < document.body.scrollHeight; y += 400) {
              window.scrollTo(0, y);
              await new Promise(r => setTimeout(r, 50));
            }
            window.scrollTo(0, document.body.scrollHeight);
            await new Promise(r => setTimeout(r, 500));

            // Wait up to 10s for loading.svg placeholders to be replaced
            for (let i = 0; i < 20; i++) {
              const imgs = Array.from(document.querySelectorAll("div.chapter-image img"));
              const loading = imgs.filter(img => (img.getAttribute("src") || "").includes("loading.svg"));
              if (loading.length === 0) break;
              await new Promise(r => setTimeout(r, 500));
            }

            const imgs = Array.from(document.querySelectorAll("div.chapter-image img"));
            return JSON.stringify(imgs.map(img => img.getAttribute("data-src") || img.getAttribute("src")));
          })();
    - return: "{page_urls}"