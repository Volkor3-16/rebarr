chapters:
  steps:
    - open: "{manga_url}"
    - extract_js:
        var: manga_hash
        script: "(window.location.href.match(/\\/title\\/([^/-]+)/) || [])[1]"
    - extract_js:
        var: request_hash
        script: |
          (function() {
            var KEYS = [
              "13YDu67uDgFczo3DnuTIURqas4lfMEPADY6Jaeqky+w=",
              "yEy7wBfBc+gsYPiQL/4Dfd0pIBZFzMwrtlRQGwMXy3Q=",
              "yrP+EVA1Dw==",
              "vZ23RT7pbSlxwiygkHd1dhToIku8SNHPC6V36L4cnwM=",
              "QX0sLahOByWLcWGnv6l98vQudWqdRI3DOXBdit9bxCE=",
              "WJwgqCmf",
              "BkWI8feqSlDZKMq6awfzWlUypl88nz65KVRmpH0RWIc=",
              "v7EIpiQQjd2BGuJzMbBA0qPWDSS+wTJRQ7uGzZ6rJKs=",
              "1SUReYlCRA==",
              "RougjiFHkSKs20DZ6BWXiWwQUGZXtseZIyQWKz5eG34=",
              "LL97cwoDoG5cw8QmhI+KSWzfW+8VehIh+inTxnVJ2ps=",
              "52iDqjzlqe8=",
              "U9LRYFL2zXU4TtALIYDj+lCATRk/EJtH7/y7qYYNlh8=",
              "e/GtffFDTvnw7LBRixAD+iGixjqTq9kIZ1m0Hj+s6fY=",
              "xb2XwHNB"
            ];
            function kb(i) {
              var b=atob(KEYS[i]),out=new Uint8Array(b.length);
              for(var j=0;j<b.length;j++) out[j]=b.charCodeAt(j);
              return out;
            }
            function rc4(key,data) {
              var s=new Uint8Array(256),j=0,t;
              for(var i=0;i<256;i++) s[i]=i;
              for(var i=0;i<256;i++){j=(j+s[i]+key[i%key.length])&0xff;t=s[i];s[i]=s[j];s[j]=t;}
              var i=0,j=0,out=new Uint8Array(data.length);
              for(var k=0;k<data.length;k++){i=(i+1)&0xff;j=(j+s[i])&0xff;t=s[i];s[i]=s[j];s[j]=t;out[k]=data[k]^s[(s[i]+s[j])&0xff];}
              return out;
            }
            function gmk(mk,idx){return mk.length>0&&idx%32<mk.length?mk[idx%32]:0;}
            function mutS(e){return(e+143)&0xff;} function mutL(e){return((e>>>1)|(e<<7))&0xff;}
            function mutC(e){return(e+115)&0xff;} function mutM(e){return(e^177)&0xff;}
            function mutF(e){return(e-188)&0xff;} function mutG(e){return((e<<2)|(e>>>6))&0xff;}
            function mutH(e){return(e-42)&0xff;}  function mutDollar(e){return((e<<4)|(e>>>4))&0xff;}
            function mutB(e){return(e-12)&0xff;}  function mutUnderscore(e){return(e-20)&0xff;}
            function mutY(e){return((e>>>1)|(e<<7))&0xff;} function mutK(e){return(e-241)&0xff;}
            function r1(data){
              var enc=rc4(kb(0),data),mk=kb(1),pk=kb(2),out=[];
              for(var i=0;i<enc.length;i++){
                if(i<7&&i<pk.length)out.push(pk[i]);
                var v=enc[i]^gmk(mk,i);
                switch(i%10){case 0:case 9:v=mutC(v);break;case 1:v=mutB(v);break;case 2:v=mutY(v);break;case 3:v=mutDollar(v);break;case 4:case 6:v=mutH(v);break;case 5:v=mutS(v);break;case 7:v=mutK(v);break;case 8:v=mutL(v);break;}
                out.push(v&255);
              }
              return new Uint8Array(out);
            }
            function r2(data){
              var enc=rc4(kb(3),data),mk=kb(4),pk=kb(5),out=[];
              for(var i=0;i<enc.length;i++){
                if(i<6&&i<pk.length)out.push(pk[i]);
                var v=enc[i]^gmk(mk,i);
                switch(i%10){case 0:case 8:v=mutC(v);break;case 1:v=mutB(v);break;case 2:case 6:v=mutDollar(v);break;case 3:v=mutH(v);break;case 4:case 9:v=mutS(v);break;case 5:v=mutK(v);break;case 7:v=mutUnderscore(v);break;}
                out.push(v&255);
              }
              return new Uint8Array(out);
            }
            function r3(data){
              var enc=rc4(kb(6),data),mk=kb(7),pk=kb(8),out=[];
              for(var i=0;i<enc.length;i++){
                if(i<7&&i<pk.length)out.push(pk[i]);
                var v=enc[i]^gmk(mk,i);
                switch(i%10){case 0:v=mutC(v);break;case 1:v=mutF(v);break;case 2:case 8:v=mutS(v);break;case 3:v=mutG(v);break;case 4:v=mutY(v);break;case 5:v=mutM(v);break;case 6:v=mutDollar(v);break;case 7:v=mutK(v);break;case 9:v=mutB(v);break;}
                out.push(v&255);
              }
              return new Uint8Array(out);
            }
            function r4(data){
              var enc=rc4(kb(9),data),mk=kb(10),pk=kb(11),out=[];
              for(var i=0;i<enc.length;i++){
                if(i<8&&i<pk.length)out.push(pk[i]);
                var v=enc[i]^gmk(mk,i);
                switch(i%10){case 0:v=mutB(v);break;case 1:case 9:v=mutM(v);break;case 2:case 7:v=mutL(v);break;case 3:case 5:v=mutS(v);break;case 4:case 6:v=mutUnderscore(v);break;case 8:v=mutY(v);break;}
                out.push(v&255);
              }
              return new Uint8Array(out);
            }
            function r5(data){
              var enc=rc4(kb(12),data),mk=kb(13),pk=kb(14),out=[];
              for(var i=0;i<enc.length;i++){
                if(i<6&&i<pk.length)out.push(pk[i]);
                var v=enc[i]^gmk(mk,i);
                switch(i%10){case 0:v=mutUnderscore(v);break;case 1:case 7:v=mutS(v);break;case 2:v=mutC(v);break;case 3:case 5:v=mutM(v);break;case 4:v=mutB(v);break;case 6:v=mutF(v);break;case 8:v=mutDollar(v);break;case 9:v=mutG(v);break;}
                out.push(v&255);
              }
              return new Uint8Array(out);
            }
            var path = '/manga/{manga_hash}/chapters';
            var base = encodeURIComponent(path + ':0:1');
            var bytes = new TextEncoder().encode(base);
            var result = r5(r4(r3(r2(r1(bytes)))));
            var bin = String.fromCharCode.apply(null, result);
            return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
          })();
    - fetch:
        url: "{base_url}/api/v2/manga/{manga_hash}/chapters?limit=100&order[number]=desc&time=1&_={request_hash}"
        method: GET
        headers:
          Referer: "{manga_url}"
        var: chapters_response
        json_path: "result.items"
        pagination:
          meta_path: "result.pagination"
          current_page_field: "current_page"
          last_page_field: "last_page"
          page_param: "page"
          start_page: 1
          max_pages: 10
    - extract_js:
        var: chapters_response
        script: |
          (function() {
            var items = {chapters_response};
            items.forEach(function(ch) {
              ch.url_slug = ch.chapter_id + '-chapter-' + ch.number;
            });
            return JSON.stringify(items);
          })();
    - from_json:
        var: chapters_response
        extract:
          number_raw: number
          title: name
          url: url_slug
          language: language
          date: created_at
          scanlator_group: scanlation_group.name
        prefix:
          url: "{manga_url}/"

# Pages: scrape all webp image URLs from script tags
pages:
  steps:
    - open: "{chapter_url}"
    - extract_js:
        var: pages_json
        script: |
          (function () {
            var scripts = document.querySelectorAll("script");
            var urls = [];

            for (var i = 0; i < scripts.length; i++) {
              var txt = scripts[i].textContent;
              if (!txt) continue;

              var matches = txt.match(/https?:\/\/[^"]+\.webp/g);
              if (matches) urls = urls.concat(matches);
            }

            return JSON.stringify([...new Set(urls)]);
          })();
    - return: "{pages_json}"
