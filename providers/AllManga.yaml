name: AllManga
base_url: https://allmanga.to
version: "2"
default_score: 5 # Large library, average quality
tags:
  - aggregator
  - cloudflare
rate_limit:
  requests_per_minute: 30

search:
  steps:
    - open: "{base_url}"
    - extract_js:
        var: search_api_url
        script: |
          (function() {
            var variables = JSON.stringify({
              search: { query: '{query_raw}', allowAdult: false, allowUnknown: false },
              limit: 20,
              page: 1,
              translationType: 'sub',
              countryOrigin: 'ALL'
            });
            var extensions = JSON.stringify({
              persistedQuery: {
                version: 1,
                sha256Hash: '2d48e19fb67ddcac42fbb885204b6abb0a84f406f15ef83f36de4a66f49f651a'
              }
            });
            return 'https://api.allanime.day/api?variables=' + encodeURIComponent(variables) + '&extensions=' + encodeURIComponent(extensions);
          })()
    - fetch:
        url: "{search_api_url}"
        method: GET
        headers:
          Accept: "*/*"
          Accept-Language: "en-US,en;q=0.9"
          Referer: "https://allmanga.to/"
          Origin: "https://allmanga.to"
          User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:148.0) Gecko/20100101 Firefox/148.0"
        var: search_results
        json_path: "data.mangas.edges"
    - from_json:
        var: search_results
        extract:
          title: name
          url: _id
          cover: thumbnail
        prefix:
          url: "{base_url}/manga/"

chapters:
  steps:
    - open: "{manga_url}"
    - extract_js:
        var: manga_id
        script: "window.location.pathname.split('/manga/')[1]?.split('/')[0] || ''"
    - intercept:
        url_contains: "api.allanime.day/api"
        var: chapters_api_response
    - script: |
        fetch('https://api.allanime.day/api', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': '*/*',
            'Origin': 'https://allmanga.to',
            'Referer': 'https://allmanga.to/'
          },
          body: JSON.stringify({
            query: 'query ($id: String!) { episodeInfos(showId: $id, episodeNumStart: 0, episodeNumEnd: 9999) { episodeIdNum notes uploadDates } }',
            variables: { id: 'manga@{manga_id}' }
          })
        }).then(r => r.json()).then(data => {
          window.__rebarr_chapters_data = data;
        });
    - sleep: 2000
    - extract_js:
        var: chapters_list
        script: |
          (function() {
            try {
              var data = window.__rebarr_chapters_data;
              if (!data || !data.data || !data.data.episodeInfos) return '[]';
              var episodes = data.data.episodeInfos;
              var mangaId = '{manga_id}';
              var baseUrl = '{base_url}';
              var chapters = [];
              episodes.forEach(function(ep) {
                var uploadDates = ep.uploadDates || {};
                Object.keys(uploadDates).forEach(function(lang) {
                  var chapterNum = ep.episodeIdNum;
                  var notes = ep.notes || '';
                  var title = notes || ('Chapter ' + chapterNum);
                  var dateStr = uploadDates[lang] || '';
                  var dateTimestamp = '';
                  if (dateStr) {
                    try {
                      dateTimestamp = Math.floor(new Date(dateStr).getTime() / 1000).toString();
                    } catch(e) {}
                  }
                  chapters.push({
                    number_raw: chapterNum.toString(),
                    title: title,
                    language: lang === 'sub' ? 'en' : lang,
                    url: baseUrl + '/manga/' + mangaId + '/chapter-' + chapterNum.toString() + '-' + lang,
                    date: dateTimestamp
                  });
                });
              });
              return JSON.stringify(chapters);
            } catch(e) {
              return '[]';
            }
          })()
    - from_json:
        var: chapters_list
        extract:
          number_raw: number_raw
          title: title
          url: url
          language: language
          date: date

pages:
  steps:
    - open: "{chapter_url}"
    - extract_js:
        var: manga_id
        script: "window.location.pathname.split('/')[2] || ''"
    - extract_js:
        # path[3] = "chapter-0-sub" → strip "chapter-" prefix and language suffix
        var: chapter_num
        script: "window.location.pathname.split('/')[3]?.replace(/^chapter-/, '').replace(/-[a-z]+$/, '') || ''"
    - script: |
        (function() {
          var variables = JSON.stringify({
            mangaId: '{manga_id}',
            translationType: 'sub',
            chapterString: '{chapter_num}',
            limit: 10,
            offset: 0
          });
          var extensions = JSON.stringify({
            persistedQuery: {
              version: 1,
              sha256Hash: 'a062f1b131dae3d17c1950fad14640d066b988ac10347ed49cfbe70f5e7f661b'
            }
          });
          var url = 'https://api.allanime.day/api?variables=' + encodeURIComponent(variables) + '&extensions=' + encodeURIComponent(extensions);
          window.__rebarr_pages_raw = null;
          fetch(url, {
            headers: {
              'Accept': '*/*',
              'Origin': 'https://allmanga.to',
              'Referer': 'https://allmanga.to/'
            }
          }).then(function(r) { return r.text(); })
            .then(function(t) { window.__rebarr_pages_raw = t; })
            .catch(function(e) { window.__rebarr_pages_raw = JSON.stringify({fetchError: e.message || String(e)}); });
        })()
    - sleep: 3000
    - extract_js:
        var: pages_result
        script: |
          (async () => {
            try {
              var raw = window.__rebarr_pages_raw;
              if (!raw) return 'ERR:no_data_after_sleep';
              var rawData = JSON.parse(raw);
              if (rawData.fetchError) return 'ERR:fetch:' + rawData.fetchError;
              if (!rawData.data) return 'ERR:no_data_field:' + raw.slice(0, 300);

              var pageListData;
              if (rawData.data.tobeparsed) {
                var AES_KEY = 'Xot36i3lK3:v1';
                var keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(AES_KEY));
                var cryptoKey = await crypto.subtle.importKey('raw', keyBytes, {name: 'AES-GCM'}, false, ['decrypt']);
                // Handle both standard and URL-safe base64
                var b64 = rawData.data.tobeparsed.replace(/-/g, '+').replace(/_/g, '/');
                var binaryStr = atob(b64);
                var bytes = new Uint8Array(binaryStr.length);
                for (var i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                var decrypted = await crypto.subtle.decrypt(
                  {name: 'AES-GCM', iv: bytes.slice(1, 13), tagLength: 128}, cryptoKey, bytes.slice(13)
                );
                pageListData = JSON.parse(new TextDecoder().decode(decrypted));
              } else {
                pageListData = rawData.data;
              }

              var edges = pageListData && pageListData.chapterPages && pageListData.chapterPages.edges;
              var edge = edges && edges[0];
              if (!edge) return 'ERR:no_edge:keys=' + Object.keys(pageListData || {}).join(',') + ':raw=' + raw.slice(0, 200);
              var serverUrl = (edge.pictureUrlHead || '').replace('aln.youtube-anime.com', 'ytimgf.youtube-anime.com');
              var baseUrl = serverUrl.match(/^https?:\/\//)
                ? serverUrl.replace(/\/?$/, '/')
                : 'https://' + serverUrl.replace(/\/?$/, '/');
              var urls = (edge.pictureUrls || []).map(function(p) {
                return {url: baseUrl + p.url, referrer: 'https://youtu-chan.com/'};
              });
              return JSON.stringify(urls);
            } catch(e) {
              return 'ERR:exception:' + (e.message || String(e));
            }
          })()
    - return: "{pages_result}"
