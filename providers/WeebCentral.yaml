name: WeebCentral
base_url: https://weebcentral.com
version: "1"
default_score: 30 # Great Official source, decent library, good quality
tags:
  - aggregator
  - official
rate_limit:
  requests_per_minute: 30

search:
  steps:
    - open: "{base_url}"
    - fetch:
        url: "{base_url}/search/simple?location=main"
        method: POST
        headers:
          HX-Request: "true"
          HX-Trigger: "quick-search-input"
          HX-Trigger-Name: "text"
          HX-Target: "quick-search-result"
          Content-Type: "application/x-www-form-urlencoded"
        body: "text={query}"
        var: search_result
    - script: "document.write(`{search_result}`);"
    - foreach:
        selector: "a"
        extract:
          title:
            selector: "div:last-child"
            content: text
            trim: true
          url:
            selector: ""
            content: attr
            attr_name: href
            prefix: "{base_url}"
          cover:
            selector: "img"
            content: attr
            attr_name: src

chapters:
  steps:
    - open: "{manga_url|strip_last_segment}/full-chapter-list"
    - foreach:
        selector: "div[x-data] > a"
        extract:
          number_raw:
            selector: "span:nth-child(2) > span:first-child"
            content: text
          # Disabled title extraction, since weebcentral doesn't use them.
          # title:
          #   selector: "span.flex > span"
          #   content: text
          url:
            selector: ""
            content: attr
            attr_name: href
            prefix: "{base_url}"
          scanlator_group:
            selector: "svg"
            content: attr
            attr_name: stroke
            value_map:
              "#d8b4fe": "Official"
              "#4C4D54": ""
          language:
            static_value: "en"
          date:
            # Grab the ISO‑8601 timestamp from the <time> element.
            selector: "time"
            content: attr
            attr_name: datetime
            date_format: "%Y-%m-%dT%H:%M:%S.%fZ"

pages:
  steps:
    - open: "{chapter_url}/images?is_prev=False&reading_style=long_strip"
    - foreach:
        selector: "img"
        extract:
          url:
            selector: ""
            content: attr
            attr_name: src
