name: Atsumaru
base_url: https://atsu.moe
version: "1"
default_score: 30 # Decent library, average quality, well organised.
tags:
  - aggregator
rate_limit:
  requests_per_minute: 30

search:
  steps:
    - open: "{base_url}"
    - fetch:
        url: "https://atsu.moe/collections/manga/documents/search?filter_by=&q={query}&limit=12&query_by=title%2CenglishTitle%2CotherNames%2Cauthors&query_by_weights=4%2C3%2C2%2C1&include_fields=id%2Ctitle%2CenglishTitle%2Cposter%2CposterSmall%2CposterMedium%2Ctype%2CisAdult%2Cstatus%2Cyear&num_typos=4%2C3%2C2%2C1"
        method: GET
        headers:
          Referer: "{base_url}/"
        var: search_results
        json_path: hits
    - from_json:
        var: search_results
        extract:
          title: document.title
          url: document.id
          cover: document.posterMedium
        prefix:
          url: "{base_url}/series/"

chapters:
  steps:
    - open: "{base_url}"
    - fetch:
        url: "https://atsu.moe/api/manga/allChapters?mangaId={manga_url|basename}"
        method: GET
        headers:
          Referer: "{base_url}/"
        var: chapters_data_raw
        json_path: chapters
    - extract_js:
        var: chapters_data
        script: |
          (() => {
            try {
              const chapters = JSON.parse('{chapters_data_raw}') || [];
              return JSON.stringify(chapters.map(ch => ({
                number: ch.number || '0',
                title: ch.title || '',
                id: ch.id || '',
                createdAt: ch.createdAt ? Math.floor(ch.createdAt / 1000).toString() : ''
              })));
            } catch(e) {
              return '[]';
            }
          })()
    - from_json:
        var: chapters_data
        extract:
          number_raw: number
          title: title
          url: id
          date: createdAt
        prefix:
          url: "{base_url}/read/{manga_url|basename}/"

pages:
  steps:
    - open: "{base_url}"
    - fetch:
        url: "https://atsu.moe/api/read/chapter?mangaId={chapter_url|strip_last_segment|basename}&chapterId={chapter_url|basename}"
        method: GET
        headers:
          Referer: "{base_url}/"
        var: pages_data
        json_path: readChapter.pages
    - from_json:
        var: pages_data
        extract:
          url: image
        prefix:
          url: "{base_url}"
